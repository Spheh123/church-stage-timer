[build]
  publish = "."

[[redirects]]
  from = "/control"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/timer"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/display"
  to = "/display.html"
  status = 200

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/firebase.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/console-model.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/display-settings.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/live-session.js"
  [headers.values]
    Cache-Control = "no-cache"
